name: Quality

on:
  pull_request:
    branches: [main, 2.x, next]
  push:
    branches: [main, 2.x, next]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['24']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm 配置卫生（#187 / #192）：只判三件真实发生过的事——`package.json#pnpm`
      # 字段（pnpm 12 不再读取）、lockfile 里生效的 override、packageManager 声明与
      # 实际运行的 pnpm 是否一致。版本基线记在 ADR，不做成门禁（见 ADR 2026-10-02）。
      - name: Check pnpm config hygiene
        run: pnpm check:toolchain

      # 注释卫生（#192）：单文件「注释 / 实码」比不得超阈值。两条豁免——实测证据主体
      # （成块且占多数）与类型定义密集（逐成员说明是冻结面的固有需要）。
      # ⚠️ 豁免一律不得只凭关键词，每条都配了反例用例，否则等于给整文件短路开口子。
      - name: Check comment hygiene
        run: pnpm check:comment-hygiene

      # raw SDK 静态扫描:组件/composables/runtime 禁止访问 BMapGL / BMap
      - name: Check raw SDK boundaries
        run: node --experimental-strip-types scripts/check-raw-sdk.mts

      # 整棵 src 树按白名单校验(driver/client/core-loader/plugins 之外的目录禁止 raw SDK)
      - name: Check raw SDK boundaries (whole src tree)
        run: node --experimental-strip-types scripts/check-raw-sdk.mts --src packages/bmap-vue/src

      # 组件 manifest 无漂移
      - name: Check API manifest
        run: node --experimental-strip-types scripts/generate-manifest-artifacts.mts --check

      # 组件总览页（docs/zh-CN/components/index.md）的手写清单与 manifest 无漂移。
      # 上一步只保证「真值没变」，这一步保证「文档跟着真值走」——两者缺一不可：
      # 清单页写「52 个组件」而真值是 56、且 GroundPoint / TextLayer /
      # PolygonLayer / PolylineLayer 四个组件一个都没列，这种漂移 generate:* 抓不到。
      - name: Check component catalog in sync with manifest
        run: node --experimental-strip-types scripts/check-component-catalog.mts

      # Capability Catalog 能力矩阵无漂移
      - name: Check capability matrix
        run: node --experimental-strip-types scripts/generate-capability-matrix.mts --check

      # 插件兼容 inventory 无漂移（M3A3-07 / #25）。
      # 生成物是 docs/zh-CN/contributing/plugin-compat-inventory.md 与
      # docs/.vitepress/plugin-inventory.json；数据源是
      # packages/bmap-vue/src/plugins/compat-inventory.ts。
      # 注意：这里只校验「数据 → 文档」无漂移，**不**联网核对真实产物——
      # 后者是 `pnpm probe:plugin-compat`（nightly / 手动），需要网络，不进 PR 门禁。
      - name: Check plugin compat inventory
        run: node --experimental-strip-types scripts/generate-plugin-inventory.mts --check

      # 公开 API 对照（vs 官方 React 参考）无漂移（#135）。
      # 生成物是 docs/zh-CN/contributing/official-api-alignment.md 与
      # docs/.vitepress/official-api-alignment.json；官方侧是 scripts/api-diff/ 快照。
      - name: Check official API alignment
        run: node --experimental-strip-types scripts/generate-api-diff.mts --check

      # 已退役的发布身份不得回到**已发布**文档面（#134 身份复位 / #135 命名对齐 / #136 clean-slate / #141）。
      # 扫 README / NOTICE / docs/**/*.md / docs/.vitepress 配置与主题 / docs/examples/**——
      # 后者是被 :::demo 容器逐字内联进页面的（configs/plugins.ts 读 examples/*.vue），所以同样是发布面。
      # 刻意**不含**：docs/adr/**（已接受即冻结的决策史，正要写出旧名）、CHANGELOG.md（上游继承史）、
      # docs/.vitepress/*.json（生成物，归 generate:*:check 管）、scripts/verify-package.mts（它把旧名当拒绝表）。
      # 合法的上游引用不误伤：官方 loader 的 `version: '3.0'` 选项、`BMap.*` 这个 JSAPI 4.0 命名空间、
      # 官方插件命名空间 `BMapGLLib`、活的 CDN 全局名 `BMapVue`，以及 yue1123/vue3-baidu-map-gl 的 MIT 署名。
      - name: Check docs brand drift
        run: node --experimental-strip-types scripts/check-docs-brand.mts

      # 文档锚点与**导航覆盖**。刻意不重复「页面级死链」——`vitepress build` 已经在做，
      # 两道门禁管同一个事实会漂移（docs/*.json 生成物也是这么处理的）。
      # 这里管的是 VitePress 静默放行的两件：① 指向不存在标题的锚点；
      # ② 反向断言每个内容页都能从 sidebar/nav 到达（孤儿页没有别的门禁看得见）。
      - name: Check docs links
        run: node --experimental-strip-types scripts/check-docs-links.mts

      # docs/public/icons/** 是品牌矢量资产的渲染产物（pnpm generate:brand-icons）。
      # 判据是「重新渲染到临时目录后逐字节比对」：改了 docs/public/brand/** 却忘了重渲染，
      # 导航栏是新标志、PWA 图标还是旧的——这类漂移不产生任何测试失败。
      # 渲染要 Chrome；runner 自带 /usr/bin/google-chrome（见下方注释）。
      - name: Check brand icons in sync with vector source
        run: node --experimental-strip-types scripts/check-brand-icons.mts

      # 覆盖物 defineEmits 静态契约无漂移（#138）。
      # 生成物是 packages/bmap-vue/src/core/overlays/overlayEventEmits.generated.ts；
      # 事实源是事件矩阵 + 弃用别名表 + 生成脚本内的非 SDK 事件表。
      # 同时核实 `resize` 没有被声明（官方事件表里有、本库无派发点）——那条命令会红，
      # 意味着「暴露一个永不触发的事件」不可能悄悄发生。
      - name: Check overlay emits contract
        run: |
          node --experimental-strip-types scripts/generate-overlay-emits.mts --check
          node --experimental-strip-types scripts/generate-overlay-emits.mts --forbid=resize

      # Playground 是三档离线装配（fake-v4 / legacy-fake / real-v4）的真实消费者，也是
      # `main.ts` 里那些组件用法的唯一编译验证点——它此前不在任何 CI 里跑。
      # 用 `@test-utils` 别名引到源码，因此不依赖 `dist`，可以放在 build 之前。
      - name: Build playground
        run: pnpm playground:build

      # 类型门禁：官方类型 + 最小 augmentation 必须在 `skipLibCheck: false` 下可合并。
      # 上游 `@baidumap/jsapi-v4-types@4.0.4` 的 `index.d.ts` 有一处文件名大小写缺陷
      # （引用 `core/displayOptions.d.ts`，实际文件是 `core/DisplayOptions.d.ts`，只在
      # 大小写敏感的文件系统上暴露），由 `patches/@baidumap__jsapi-v4-types@4.0.4.patch`
      # 在安装期修补；处置决策见 docs/adr/2026-09-13-upstream-types-case-patch.md（issue #50）。
      # 必须排在 `build:package` 之前：vue-tsc 会把声明 emit 到 `dist/`，位于 build 之后会让
      # `check:public-dts` 看到 typecheck 的产物而假失败（build 会先清空 dist）。
      - name: Type-check package (official types + augmentations)
        run: pnpm typecheck:package

      # 测试代码的类型门禁（issue #37 评审 4）：tests/** 此前**不在任何 typecheck 的编译范围里**
      # —— 一个 `recorder.sample(name, ms, extra)` 的 TS2554 就是这样从 PR 里漏过去的
      # （vitest 只转译不做类型检查，CI 全绿）。范围只覆盖 tests/performance/**（它 import 的
      # test-utils / src 会被传递纳入）；tests/behavior/** 与 packages/**\/*.test.ts 有大量既存
      # 错误，全量纳入是另一张票的工作量（见 tsconfig.tests.json 的注释）。
      - name: Type-check tests (tests/performance)
        run: pnpm typecheck:tests

      # 公共**类型面**契约（issue #139 评审 P2）：@ts-expect-error 断言必须被某个 tsc 编译才成立，
      # 而 serviceTask.test.ts 不在任何 typecheck 范围内（tsconfig.build.json 排除 *.test.ts，
      # tsconfig.tests.json 只 include performance / live-performance）——实测把那层类型放宽后
      # 三个门禁 + 16 条运行时用例全绿。范围只收 tests/type-contracts/，不碰 packages/ 下的既存错误。
      - name: Type-check type contracts (@ts-expect-error gate)
        run: pnpm typecheck:type-contracts

      # Behavior snapshot tests (data-driven, no external network/AK)
      - name: Build artifacts for global bundle tests
        run: node --experimental-strip-types scripts/build-package.mts

      # 公共声明边界:dist/**/*.d.ts 不得泄漏 BMap.* / 官方类型包引用
      - name: Check public d.ts boundaries
        run: node --experimental-strip-types scripts/check-public-dts.mts

      # 旧引擎不变量（M3A3-REMOVE-LEGACY / #26，合并进 check-raw-sdk 于 #136）：整棵源码树
      # （含被 raw SDK 白名单放行的 driver/client/core-loader/plugins）不得再出现 BMapGL /
      # 已删除的 engine 取值。这一步就是上面「whole src tree」那一步的第二套规则集——树模式
      # 对白名单目录只跑旧引擎残留规则、对禁区内跑全套，所以它一条命令覆盖两组边界。
      #
      # 公共声明相位（`dist/**/*.d.ts`）必须排在 `build:package` 之后：它读 `dist`，而且
      # `check-public-dts` 只禁 `BMap.*`，**不**禁已删除的 engine 取值字面量——那要靠这一步。
      - name: Check no legacy engine ids in public declarations
        run: pnpm check:raw-sdk:declarations

      # README / npm 包 / 文档站三处的 API 示例一致。判据是「示例里用到的每个标识符都必须
      # 真的在 dist/*.d.ts 里，且三处形状一致」——不是「三处文本相等」：后者没有区分力
      # （三处都写错照样绿），还会因为文案风格差异逼人锁死措辞。
      #
      # **必须排在 `build:package` 之后**：判据读的就是发布声明面，读不到时脚本 fail-closed
      # （「没有判据就不能放行」）。曾经挂在前面、跑在 build 之前，于是 CI 直接红——
      # 那是这条守卫按设计生效，不是误报。
      - name: Check API snippet consistency
        run: node --experimental-strip-types scripts/check-snippet-consistency.mts

      # 文档/示例里写出的 prop 名 vs 真实声明面。`docs:typecheck` **抓不到**这一类：
      # 写错的 kebab prop 会落进 `$attrs`，既不报错也不生效，只能靠静态比对。
      - name: Check doc prop names
        run: node --experimental-strip-types scripts/check-doc-props.mts

      # `<Map>` 交互开关 prop 的「未传」可达性（#179）。判据：INTERACTION_PROPS 覆盖的
      # 每一个 prop 都必须在 Map.vue 的 withDefaults 里显式出现 —— 否则 Vue 把缺省 Boolean
      # 的「没传」强转成 false，syncEnableProps 的 `!== undefined` 守卫对它永不命中，
      # 官方 `@default true` 的双指/双击缩放被静默 disable*()。不依赖 dist，可以放 build 之前。
      - name: Check interaction prop defaults
        run: node --experimental-strip-types scripts/check-interaction-props.mts

      # 反向门禁：`*Props` 里声明了却没有读者的 prop（#177）。已有的声明面门禁全部只覆盖
      # 一个方向，因此 `<LocationControl>.onLocationStart` 声明了、被 Vue 接收、然后被静默丢弃，
      # 没有任何一道门禁会红。这条要求每个声明 prop 都真的有读者。
      - name: Check declared props are projected
        run: node --experimental-strip-types scripts/check-props-projected.mts

      # 发布声明的严格消费（#188）。判据是「消费方开 skipLibCheck: false 能编译」——
      # 这是唯一一道能发现「声明里有悬空标识符」的门禁：check:api 用的是 API Extractor，
      # 它对 `typeof __VLS_N` 这类模块局部引用是**分析不出来**的（那正是 #188 的原始缺陷：
      # 51 处 TS2304 发布出去，而 check:api / verify:package 全绿）。
      # 输入同样是 `dist/**/*.d.ts`，故排在 `build:package` 之后。
      - name: Check published declarations compile under skipLibCheck:false
        run: pnpm check:dts-strict

      # 公共 API report 基线（#44 验收项「API report 只有经过审核的新 1.0 面」）。
      # 输入是 `dist/**/*.d.ts`，所以必须排在 `build:package` 之后（与 public-dts 同一条顺序约束）。
      # 七个出口都进报告（#188 起；此前 index / components 因 Volar 悬空引用挂在一个
      # 「预期失败即通过」的探针上，该豁免已撤销）。
      - name: Check API report baselines
        run: pnpm check:api

      # 单一执行入口：tests/behavior + packages/**（含 core/loader 的 Loader 测试），
      # 避免 CI 与本地 `pnpm test:unit` 的执行范围漂移。
      - name: Unit & behavior tests
        run: pnpm test:unit

      # Package tarball consumer verification（#158 工作包 E）。
      #
      # 与 `package` job 用**同一个**入口（`pnpm verify:package`），而不是直接跑脚本：
      # 直接跑脚本时两处会分叉 —— 这里少了 `.artifacts` 清理，`findTarball` 在多个同身份
      # tarball 之间无法确定验的是哪一个；而 `package` job 早就按 `npm script` 调同一个
      # 实现。`verify-package.mts` 从 manifest 派生全部身份信息，所以单一入口既正确又更全。
      - name: Verify package consumers
        run: |
          rm -rf .artifacts && mkdir -p .artifacts
          pnpm pack:package
          pnpm verify:package



  # 性能基准与预算（M6-PERFORMANCE / #37）。
  #
  # 判定口径（详见 ADR 2026-09-21）：
  # - 只把**归一化**后的读数与提交基线（tests/performance/baseline.json）比，阈值默认 5×，
  #   低于噪声地板的指标不参与——非目标明确禁止把单机绝对值当跨平台硬阈值；
  # - 退出码四态：0 通过 / 1 超阈值回退 / 2 脚手架或判据失败 / 3 blocked。**2 与 3 都不是通过**，
  #   所以这一步不能用 `continue-on-error` 架空；
  # - 先 `build:package`：包体与 worker chunk 读数需要 `dist`，缺了它基准会以 3（blocked）收场。
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package (包体读数与 worker chunk 检查的前置)
        run: node --experimental-strip-types scripts/build-package.mts

      - name: Performance baseline & trend gate
        run: pnpm perf:baseline

      # 报告在 job 日志里就能读（stdout 表格）；这一步是为了让「谁在什么时候跑出什么数」留档。
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-report
          path: .artifacts/perf/
          if-no-files-found: error

  # v4 浏览器 smoke 的确定性档（fixture）：无 AK、无外网，注入 Fake v4 命名空间跑同一份
  # 组件树。真 SDK 的 required smoke 在 nightly（见 nightly-v4-smoke.yml）——把两者分开，
  # 是因为「基础加载失败」不该等到 nightly 才发现，而真实 AK/外网又不该进 PR 门禁。
  smoke-v4-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 浏览器不额外安装：resolveBrowser() 的候选里包含 runner 预装的 /usr/bin/google-chrome。
      # 判定口径（report.mts）：required 只接受 pass，blocked/skipped/expected-failure 都不可放行。
      - name: v4 browser smoke (fixture, no network)
        run: pnpm smoke:v4:fixture

  # 文档站：格式 / lint / 类型 / 构建。
  # 此前**没有任何 CI 跑它们**，于是三样长期是红的（`docs:typecheck` 23 条 error、
  # `docs:format:check` 2 个文件、`docs:build` 一处未闭合标签），而「docs 通过」是 #25 的验收项。
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # docs 的类型检查与运行时都对着**发布产物**（见 docs/tsconfig.json 的 paths），
      # 因此先构建组件库；顺序反了会得到「找不到 dist/*.d.ts」的假失败。
      - name: Build package (docs 类型检查 / 站点的前置)
        run: node --experimental-strip-types scripts/build-package.mts

      - name: Docs format check
        run: pnpm docs:format:check

      - name: Docs lint
        run: pnpm docs:lint

      - name: Docs typecheck
        run: pnpm docs:typecheck

      - name: Docs build
        run: pnpm docs:build

  # package: build + type-check + publint + attw + tarball consumer
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6

      - name: Install dependencies (pnpm workspace)
        run: pnpm install --frozen-lockfile

      # `volar.d.ts` 是 .gitignore 的生成产物，只由这一步写（连 --check 模式也写，见
      # generate-manifest-artifacts.mts 第 81 行）。它必须排在 `pack` 之前，否则 tarball
      # 会**静默缺 Volar 类型**而 README 与安装页都承诺了自动补全。此前没有任何东西强制
      # 这个顺序：CI 恰好因为 `quality` job 的 manifest 步骤而侥幸带上，一次真正的
      # `npm publish` 或任何直接跑 `pnpm pack:package` 的人都会发出版本缺件的包。
      # 结构上补上这一步，`check:pack-contents` 再从结果侧钉死它。
      - name: Generate manifest artifacts (volar.d.ts must exist before pack)
        run: node --experimental-strip-types scripts/generate-manifest-artifacts.mts --check

      - name: Build package (vp pack)
        run: node --experimental-strip-types scripts/build-package.mts

      - name: Check public d.ts boundaries
        run: node --experimental-strip-types scripts/check-public-dts.mts

      # publint / attw / API Extractor 的版本锁与结构化判定（#45）。
      # 原本是两行 `npx -y`（版本不锁，lockfile 管不到）加一句
      # `grep -q 'node16 (from ESM).*🟢' || true`——那句 grep 把 attw 报的
      # CJSResolvesToESM（7 个子路径）与 NoResolution（6 个子路径）全藏住了，
      # `|| true` 还吞掉了 attw 自己的退出码（崩了与判了长得一样）。
      # 现在改为读 attw 的 JSON `problems`，已审阅的例外逐条打印，未登记的一律红。
      - name: Check package shape (publint + attw + version pins)
        run: pnpm check:package-shape

      # 发布 tarball 的文件清单（#45）。publint/attw 都只看**目录**（自己重新打包），
      # 因此「files 声明了却没发出去」它们一条都抓不到；这道门禁判的是实际发布的那一个
      # tarball。它排在 check:package-shape 之后，因为那一步会先跑 build（产出 dist），
      # 后面这里才有东西可 pack。
      - name: Check pack contents (files / exports / forbidden paths)
        run: |
          rm -rf .artifacts && mkdir -p .artifacts
          pnpm pack:package
          pnpm check:pack-contents

      # tarball 消费方验证：**调 `pnpm verify:package`，不再在本文件里复刻一遍**。
      #
      # 原本这里内联了 `cp .artifacts/bmap-vue-*.tgz …` + `npm install` + `vue-tsc` +
      # `import('bmap-vue')`。两个问题（PR 评审 P1）：
      # ① 包名迁到 `@mangax/bmap-vue` 后那个 glob 匹配不到任何文件（实际产物是
      #    `mangax-bmap-vue-<version>.tgz`），job 会在消费验证前就失败；
      # ② 即使修好 glob，它验的也不是用户真正会安装/导入的那个包名，且覆盖面落后于
      #    `verify:package`（没有 `./ui-kit` 与 `./advanced` 子入口探针）。
      #
      # `verify-package.mts` 早已从 manifest 派生全部身份信息（见 scripts/release-identity.mts），
      # 所以单一实现既正确又更全。`quality` job 那一步同样调它，两处口径从此一致。
      - name: Package tarball consumer (verify:package)
        run: pnpm verify:package
