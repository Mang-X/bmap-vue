name: Quality

on:
  pull_request:
    branches: [main, 2.x, next]
  push:
    branches: [main, 2.x, next]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['24']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # raw SDK 静态扫描:组件/composables/runtime 禁止访问 BMapGL / BMap
      - name: Check raw SDK boundaries
        run: node --experimental-strip-types scripts/check-raw-sdk.mts

      # 整棵 src 树按白名单校验(driver/client/core-loader/plugins 之外的目录禁止 raw SDK)
      - name: Check raw SDK boundaries (whole src tree)
        run: node --experimental-strip-types scripts/check-raw-sdk.mts --src packages/bmap-vue/src

      # 组件 manifest 无漂移
      - name: Check API manifest
        run: node --experimental-strip-types scripts/generate-manifest-artifacts.mts --check

      # Capability Catalog 能力矩阵无漂移
      - name: Check capability matrix
        run: node --experimental-strip-types scripts/generate-capability-matrix.mts --check

      # 插件兼容 inventory 无漂移（M3A3-07 / #25）。
      # 生成物是 docs/zh-CN/contributing/plugin-compat-inventory.md 与
      # docs/.vitepress/plugin-inventory.json；数据源是
      # packages/bmap-vue/src/plugins/compat-inventory.ts。
      # 注意：这里只校验「数据 → 文档」无漂移，**不**联网核对真实产物——
      # 后者是 `pnpm probe:plugin-compat`（nightly / 手动），需要网络，不进 PR 门禁。
      - name: Check plugin compat inventory
        run: node --experimental-strip-types scripts/generate-plugin-inventory.mts --check

      # 公开 API 对照（vs 官方 React 参考）无漂移（#135）。
      # 生成物是 docs/zh-CN/contributing/official-api-alignment.md 与
      # docs/.vitepress/official-api-alignment.json；官方侧是 scripts/api-diff/ 快照。
      - name: Check official API alignment
        run: node --experimental-strip-types scripts/generate-api-diff.mts --check

      # 覆盖物 defineEmits 静态契约无漂移（#138）。
      # 生成物是 packages/bmap-vue/src/core/overlays/overlayEventEmits.generated.ts；
      # 事实源是事件矩阵 + 弃用别名表 + 生成脚本内的非 SDK 事件表。
      # 同时核实 `resize` 没有被声明（官方事件表里有、本库无派发点）——那条命令会红，
      # 意味着「暴露一个永不触发的事件」不可能悄悄发生。
      - name: Check overlay emits contract
        run: |
          node --experimental-strip-types scripts/generate-overlay-emits.mts --check
          node --experimental-strip-types scripts/generate-overlay-emits.mts --forbid=resize

      # Playground 是三档离线装配（fake-v4 / legacy-fake / real-v4）的真实消费者，也是
      # `main.ts` 里那些组件用法的唯一编译验证点——它此前不在任何 CI 里跑。
      # 用 `@test-utils` 别名引到源码，因此不依赖 `dist`，可以放在 build 之前。
      - name: Build playground
        run: pnpm playground:build

      # 类型门禁：官方类型 + 最小 augmentation 必须在 `skipLibCheck: false` 下可合并。
      # 上游 `@baidumap/jsapi-v4-types@4.0.4` 的 `index.d.ts` 有一处文件名大小写缺陷
      # （引用 `core/displayOptions.d.ts`，实际文件是 `core/DisplayOptions.d.ts`，只在
      # 大小写敏感的文件系统上暴露），由 `patches/@baidumap__jsapi-v4-types@4.0.4.patch`
      # 在安装期修补；处置决策见 docs/adr/2026-09-13-upstream-types-case-patch.md（issue #50）。
      # 必须排在 `build:package` 之前：vue-tsc 会把声明 emit 到 `dist/`，位于 build 之后会让
      # `check:public-dts` 看到 typecheck 的产物而假失败（build 会先清空 dist）。
      - name: Type-check package (official types + augmentations)
        run: pnpm typecheck:package

      # 测试代码的类型门禁（issue #37 评审 4）：tests/** 此前**不在任何 typecheck 的编译范围里**
      # —— 一个 `recorder.sample(name, ms, extra)` 的 TS2554 就是这样从 PR 里漏过去的
      # （vitest 只转译不做类型检查，CI 全绿）。范围只覆盖 tests/performance/**（它 import 的
      # test-utils / src 会被传递纳入）；tests/behavior/** 与 packages/**\/*.test.ts 有大量既存
      # 错误，全量纳入是另一张票的工作量（见 tsconfig.tests.json 的注释）。
      - name: Type-check tests (tests/performance)
        run: pnpm typecheck:tests

      # 公共**类型面**契约（issue #139 评审 P2）：@ts-expect-error 断言必须被某个 tsc 编译才成立，
      # 而 serviceTask.test.ts 不在任何 typecheck 范围内（tsconfig.build.json 排除 *.test.ts，
      # tsconfig.tests.json 只 include performance / live-performance）——实测把那层类型放宽后
      # 三个门禁 + 16 条运行时用例全绿。范围只收 tests/type-contracts/，不碰 packages/ 下的既存错误。
      - name: Type-check type contracts (@ts-expect-error gate)
        run: pnpm typecheck:type-contracts

      # Behavior snapshot tests (data-driven, no external network/AK)
      - name: Build artifacts for global bundle tests
        run: node --experimental-strip-types scripts/build-package.mts

      # 公共声明边界:dist/**/*.d.ts 不得泄漏 BMap.* / 官方类型包引用
      - name: Check public d.ts boundaries
        run: node --experimental-strip-types scripts/check-public-dts.mts

      # 旧引擎不变量（M3A3-REMOVE-LEGACY / #26，合并进 check-raw-sdk 于 #136）：整棵源码树
      # （含被 raw SDK 白名单放行的 driver/client/core-loader/plugins）不得再出现 BMapGL /
      # 已删除的 engine 取值。这一步就是上面「whole src tree」那一步的第二套规则集——树模式
      # 对白名单目录只跑旧引擎残留规则、对禁区内跑全套，所以它一条命令覆盖两组边界。
      #
      # 公共声明相位（`dist/**/*.d.ts`）必须排在 `build:package` 之后：它读 `dist`，而且
      # `check-public-dts` 只禁 `BMap.*`，**不**禁已删除的 engine 取值字面量——那要靠这一步。
      - name: Check no legacy engine ids in public declarations
        run: pnpm check:raw-sdk:declarations

      # 单一执行入口：tests/behavior + packages/**（含 core/loader 的 Loader 测试），
      # 避免 CI 与本地 `pnpm test:unit` 的执行范围漂移。
      #
      # CONTRAST_DIFF_BASE = 本 PR 的 base（`base_ref…HEAD`）。#140 的门禁
      # 「benchmark 没有改生产语义」要比的正是「本 PR 改了什么」，不是「工作区脏不脏」——
      # 不注入 base 时那条门禁在干净的 CI checkout 上恒绿（工作区 = HEAD）。
      # 没有 `CONTRAST_DIFF_BASE`（例如手工跑）时门禁退回本地 `merge-base HEAD main`；
      # 浅克隆取不到 base 就明确失败，不静默放行。
      - name: Unit & behavior tests
        run: pnpm test:unit
        env:
          CONTRAST_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

      # Package tarball consumer verification
      - name: Verify package consumers
        run: |
          rm -rf .artifacts && mkdir -p .artifacts
          pnpm --filter bmap-vue pack --pack-destination .artifacts
          node --experimental-strip-types scripts/verify-package.mts



  # 性能基准与预算（M6-PERFORMANCE / #37）。
  #
  # 判定口径（详见 ADR 2026-09-21）：
  # - 只把**归一化**后的读数与提交基线（tests/performance/baseline.json）比，阈值默认 5×，
  #   低于噪声地板的指标不参与——非目标明确禁止把单机绝对值当跨平台硬阈值；
  # - 退出码四态：0 通过 / 1 超阈值回退 / 2 脚手架或判据失败 / 3 blocked。**2 与 3 都不是通过**，
  #   所以这一步不能用 `continue-on-error` 架空；
  # - 先 `build:package`：包体与 worker chunk 读数需要 `dist`，缺了它基准会以 3（blocked）收场。
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package (包体读数与 worker chunk 检查的前置)
        run: node --experimental-strip-types scripts/build-package.mts

      - name: Performance baseline & trend gate
        run: pnpm perf:baseline

      # 报告在 job 日志里就能读（stdout 表格）；这一步是为了让「谁在什么时候跑出什么数」留档。
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-report
          path: .artifacts/perf/
          if-no-files-found: error

  # 与 `@baidumap/vue-bmap@1.0.1`（票面锁定的基线版本）的**同机同进程**对照（#140）。
  #
  # 刻意**不设跨机器阈值**：两侧读数并排是为了看「架构差」（实例重建、SDK 写入、残留），
  # 绝对毫秒在 GitHub runner 上与本地不可比。唯一能让本 job 失败的是**不变式被破坏**
  # （退出码 1）或**脚手架坏了**（2）/ **没跑成**（3）——都不是机器差异。
  #
  # 也不需要 `build:package` 与 AK：Fake 档用 `createFakeV4Harness()`，官方库经
  # `jsapi-loader` 复用 `window.BMap`（见 tests/performance/officialContrastHarness.ts 文件头）。
  official-contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Official contrast (bmap-vue vs @baidumap/vue-bmap@1.0.1, no AK)
        run: pnpm perf:contrast

      # 包体档（指标 8）需要 dist：本库不是被安装的依赖，而是「待测对象」，
      # 打包配置 alias 指向 packages/bmap-vue/dist/index.mjs。缺 dist 时脚本按脚手架失败
      # （exit 2）报「先 build:package」，不拿 src 现编顶替——那量的不是发布物。
      - name: Build package (bundle contrast target)
        run: pnpm build:package

      - name: Bundle contrast (entry bytes vs own baseline, deterministic)
        run: pnpm perf:contrast:bundle

      # 读数要能事后核对「哪一版在什么机器上跑出了什么」，而不是只看 job 变绿。
      - name: Upload official contrast report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: official-contrast-report
          path: .artifacts/perf-contrast/
          if-no-files-found: error

      - name: Upload bundle contrast report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: official-contrast-bundle-report
          path: .artifacts/perf-contrast-bundle/bundle-report.json
          if-no-files-found: error

  # v4 浏览器 smoke 的确定性档（fixture）：无 AK、无外网，注入 Fake v4 命名空间跑同一份
  # 组件树。真 SDK 的 required smoke 在 nightly（见 nightly-v4-smoke.yml）——把两者分开，
  # 是因为「基础加载失败」不该等到 nightly 才发现，而真实 AK/外网又不该进 PR 门禁。
  smoke-v4-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 浏览器不额外安装：resolveBrowser() 的候选里包含 runner 预装的 /usr/bin/google-chrome。
      # 判定口径（report.mts）：required 只接受 pass，blocked/skipped/expected-failure 都不可放行。
      - name: v4 browser smoke (fixture, no network)
        run: pnpm smoke:v4:fixture

  # 文档站：格式 / lint / 类型 / 构建。
  # 此前**没有任何 CI 跑它们**，于是三样长期是红的（`docs:typecheck` 23 条 error、
  # `docs:format:check` 2 个文件、`docs:build` 一处未闭合标签），而「docs 通过」是 #25 的验收项。
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # docs 的类型检查与运行时都对着**发布产物**（见 docs/tsconfig.json 的 paths），
      # 因此先构建组件库；顺序反了会得到「找不到 dist/*.d.ts」的假失败。
      - name: Build package (docs 类型检查 / 站点的前置)
        run: node --experimental-strip-types scripts/build-package.mts

      - name: Docs format check
        run: pnpm docs:format:check

      - name: Docs lint
        run: pnpm docs:lint

      - name: Docs typecheck
        run: pnpm docs:typecheck

      - name: Docs build
        run: pnpm docs:build

  # package: build + type-check + publint + attw + tarball consumer
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6

      - name: Install dependencies (pnpm workspace)
        run: pnpm install --frozen-lockfile

      - name: Build package (vp pack)
        run: node --experimental-strip-types scripts/build-package.mts

      - name: Check public d.ts boundaries
        run: node --experimental-strip-types scripts/check-public-dts.mts

      - name: publint
        run: |
          cd packages/bmap-vue
          npx -y publint .

      - name: attw (ESM+types contract)
        run: |
          cd packages/bmap-vue
          npx -y @arethetypeswrong/cli --pack . --format table > /tmp/attw.txt 2>&1 || true
          grep -q 'node16 (from ESM).*🟢' /tmp/attw.txt || (cat /tmp/attw.txt; exit 1)

      - name: package tarball consumer
        run: |
          rm -rf .artifacts && mkdir -p .artifacts
          pnpm --filter bmap-vue pack --pack-destination .artifacts
          cp .artifacts/bmap-vue-*.tgz .artifacts/bmap-vue.tgz
          cd fixtures/consumer
          npm install --no-audit --no-fund --ignore-scripts
          npx vue-tsc --noEmit
          node -e "import('bmap-vue').then(m=>{if(!m.Map)throw new Error('missing Map');console.log('consumer OK')})"
