version: 2
updates:
  # pnpm workspace：依赖声明集中在根 package.json，从根目录扫描即可覆盖全部 workspace 包
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # minor + patch 合成一个 PR 降噪；major 单独开，便于逐个判断迁移成本
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # vue 是 peerDependency；typescript / vue-tsc 的 major 会同时牵动**两个**互不相容的
      # 环节，必须由维护者一起评估后再升：
      #
      #   - packages/bmap-vue 与根：vue-tsc 2.x —— 三个 typecheck 门禁；
      #   - docs：vue-tsc 3.x —— 文档站对着 dist/*.d.ts 做消费方校验；
      #   - 而 dist/*.d.ts 本身由 @vue/language-core 2.x 产出（vite-plugin-dts → unplugin-dts），
      #     不是由 vue-tsc 产出（build-package.mts 只 shell out 两次 vite）。
      #
      # ⚠️ 此前这段注释的理由挂在根 package.json 的 `pnpm.overrides`（vue-tsc 3.3.11、
      # @vue/language-core 2.2.0）上。那条 override 写在 `package.json#pnpm` 字段里，
      # **pnpm 12 早就不读该字段**，因此它从写下起就没生效过（实际是包构建 2.2.12、
      # 只有 docs 用 3.3.11）——用一条从未生效的配置来解释「为什么锁住」，等于没有理由。
      # 真实基线现记在 ADR 2026-10-02 的「版本事实」表里（#187 / #192）；`pnpm check:toolchain`
      # **只判 pnpm 配置卫生，不核对版本基线**（原先的 `TOOLCHAIN_PINS` 登记已在 #192 删除），
      # 所以这里的 ignore 是靠**本注释 + lockfile diff** 维持的约定，不是机器判据。
      # 安全更新不受本配置影响。
      - dependency-name: vue
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: vue-tsc
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Shanghai
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
